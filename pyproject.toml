[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdbpeek"
version = "0.1.0"
description = "Parse PDB structures and measure solvent accessibility from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ulzhan Khamidolla", email = "khamidolla.ulzhan@gmail.com" }]
keywords = ["structural-biology", "protein", "pdb", "sasa", "mmcif"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# pytest is all the suite needs. freesasa is only for regenerating the
# reference values in tests/fixtures/sasa_reference.json, which are committed.
test = ["pytest>=7"]
reference = ["freesasa>=2.2"]

[project.scripts]
pdbpeek = "pdbpeek.cli:main"

[project.urls]
Homepage = "https://github.com/janeulzhan/pdbpeek"
Source = "https://github.com/janeulzhan/pdbpeek"

[tool.setuptools]
packages = ["pdbpeek"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Network tests are deselected by default so a fresh clone runs offline and
# hermetically. Slow tests shell out to the benchmark generators, which take
# seconds rather than milliseconds. Both are deselected by default and both
# run in CI as their own step.
#   pytest             offline, fast
#   pytest -m network  the live endpoint checks
#   pytest -m slow     the benchmark generators
addopts = "-m 'not network and not slow' --strict-markers"
markers = [
    "network: hits a live RCSB or PDBe endpoint; deselected by default",
    "slow: shells out to a benchmark generator; deselected by default",
]
