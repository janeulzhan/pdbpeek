name: Deploy demo to Pages

# Publishes docs/ to GitHub Pages. The demo is plain static files, no bundler
# and no build step, so this uploads the directory as it sits in the
# repository. That is deliberate: what is deployed is byte for byte what the
# parity test ran against.
#
# Pages has to be switched to the "GitHub Actions" source once, under
# Settings > Pages, or via:
#   gh api -X POST repos/:owner/:repo/pages -f build_type=workflow

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
